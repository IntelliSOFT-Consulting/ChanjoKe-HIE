version: "3.8"

networks:
  cloudbuild:
    external: true

volumes:
  mongodb-data:
  hapi-fhir-postgres:
  keycloak-postgres:
  dwh-data:

services:
  # ==========================================
  # DATABASE SERVICES
  # ==========================================

  mongo:
    container_name: openhim-mongo
    image: mongo:4.0
    networks:
      - cloudbuild
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

  hapi-fhir-postgres:
    container_name: hapi-fhir-postgres
    image: postgres:14-alpine
    restart: always
    networks:
      - cloudbuild
    environment:
      POSTGRES_USER: ${HAPI_DB_USER}
      POSTGRES_DB: ${HAPI_DB_NAME}
      POSTGRES_PASSWORD: ${HAPI_DB_PASSWORD}
    volumes:
      - hapi-fhir-postgres:/var/lib/postgresql/data

  keycloak-postgres:
    container_name: keycloak-postgres
    image: postgres:14-alpine
    restart: on-failure
    networks:
      - cloudbuild
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-postgres:/var/lib/postgresql/data

  # ==========================================
  # CORE HIE SERVICES
  # ==========================================

  hapi-fhir-jpa:
    image: hapiproject/hapi:v6.8.0
    container_name: hapi-fhir-jpa
    restart: unless-stopped
    networks:
      - cloudbuild
    depends_on:
      - hapi-fhir-postgres
    ports:
      - "8081:8080"
    volumes:
      - "./generated-configs/hapi-fhir:/hapi"
    environment:
      SPRING_CONFIG_LOCATION: /hapi/application.yaml

  openhim-core:
    container_name: openhim-core
    restart: unless-stopped
    image: jembi/openhim-core:latest
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "5001:5001"
    depends_on:
      - mongo
    networks:
      - cloudbuild
    healthcheck:
      test: "curl -sSk https://openhim-core:8080/heartbeat || exit 1"
      interval: 30s
      timeout: 30s
      retries: 3

  openhim-console:
    container_name: openhim-console
    image: jembi/openhim-console:latest
    restart: unless-stopped
    networks:
      - cloudbuild
    healthcheck:
      test: "curl -sS http://openhim-console || exit 1"
      interval: 30s
      timeout: 30s
      retries: 3
    volumes:
      - ./generated-configs/openhim/default.json:/usr/share/nginx/html/config/default.json:ro
      - /etc/ssl/crt:/etc/nginx/certs

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.1
    container_name: keycloak
    restart: on-failure
    networks:
      - cloudbuild
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    depends_on:
      - keycloak-postgres
    command: start-dev
    ports:
      - 8082:8080

  # ==========================================
  # WEB APPLICATIONS
  # ==========================================

  chanjoke-auth:
    container_name: chanjoke-auth
    build: ./chanjoke-auth
    restart: unless-stopped
    networks:
      - cloudbuild
    environment:
      NODE_ENV: ${NODE_ENV}
      JWT_SECRET: ${CHANJOKE_AUTH_JWT_SECRET}
      DATABASE_URL: ${CHANJOKE_AUTH_DB_URL}
    depends_on:
      - hapi-fhir-postgres
    ports:
      - "3001:3000"

  provider:
    container_name: provider-app
    build:
      context: ./ChanjoKe-provider-web-app
      dockerfile: docker/Dockerfile.prod
      args:
        VITE_SERVER_BASE_URL: ${VITE_SERVER_BASE_URL}
        VITE_SUPERSET_DOMAIN: ${VITE_SUPERSET_DOMAIN}
        VITE_DASHBOARD_ID: ${VITE_DASHBOARD_ID}
    restart: unless-stopped
    networks:
      - cloudbuild
    environment:
      NODE_ENV: ${NODE_ENV}
    ports:
      - "3002:3000"

  client:
    container_name: patient-app
    build:
      context: ./ChanjoKe-patient-web-app
      dockerfile: docker/Dockerfile.prod
      args:
        VITE_SERVER_BASE_URL: ${VITE_SERVER_BASE_URL}
    restart: unless-stopped
    networks:
      - cloudbuild
    environment:
      NODE_ENV: ${NODE_ENV}
    ports:
      - "3003:3000"

  # ==========================================
  # DATA PIPELINE SERVICES (OPTIONAL)
  # ==========================================
  #
  # OPTION 1: Build from source (recommended)
  # Uncomment the section below to build the data pipeline controller locally
  #
  # pipeline-controller:
  #   build:
  #     context: ./fhir-data-pipes
  #     dockerfile: Dockerfile
  #   container_name: pipeline-controller
  #   restart: unless-stopped
  #   networks:
  #     - cloudbuild
  #   ports:
  #     - "8085:8080"
  #   volumes:
  #     - ./generated-configs/data-pipes:/app/config
  #     - dwh-data:/dwh
  #   depends_on:
  #     - hapi-fhir-jpa
  #   environment:
  #     SPRING_CONFIG_LOCATION: /app/config/application.yaml
  #
  # OPTION 2: Use pre-built image (if you have access to Google Cloud)
  # pipeline-controller:
  #   image: us-docker.pkg.dev/fhir-org-starter-project/fhir-pipelines/controller:latest
  #   container_name: pipeline-controller
  #   restart: unless-stopped
  #   networks:
  #     - cloudbuild
  #   ports:
  #     - "8085:8080"
  #   volumes:
  #     - ./generated-configs/data-pipes:/workspace/config
  #     - dwh-data:/dwh
  #   depends_on:
  #     - hapi-fhir-jpa
  #   environment:
  #     SPRING_CONFIG_LOCATION: /workspace/config/application.yaml

  # ==========================================
  # PROXY SERVICE
  # ==========================================

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    networks:
      - cloudbuild
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./generated-configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${SSL_CERT_PATH}:/opt/ssl.crt:ro
      - ${SSL_KEY_PATH}:/opt/ssl.key:ro
    depends_on:
      - openhim-console
      - openhim-core
      - hapi-fhir-jpa
      - provider
      - client
      - keycloak
      - chanjoke-auth
      # - pipeline-controller  # Uncomment if enabling data pipeline
